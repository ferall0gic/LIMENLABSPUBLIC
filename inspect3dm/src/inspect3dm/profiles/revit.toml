# Built-in "revit" profile (v0.2): default plus checks for known Revit import
# limits. It checks the file before it is sent to Revit; it does not run Revit
# and cannot guarantee that an import will succeed. Thresholds and sources are
# listed in the README section "Checking files for Revit". All are configurable:
# write a profile with  extends = "revit"  and change only the keys you need.

[profile]
name = "revit"
extends = "default"

[rules.validity]
# Revit rejects invalid Breps (falls back to mesh or fails the import).
enabled = true
severity = "error"

[rules.document]
severity = "error"                 # missing units: the most common cause of scale errors
tolerance_severity = "warning"     # the 1/10 rule below is guidance, not a published limit
allowed_units = []
absolute_tolerance_min_mm = 0.0001     # 0.1 micron: catches unusably tight tolerances only
absolute_tolerance_max_mm = 0.079375   # 1/10 of the ~0.79 mm short-curve tolerance

[rules.short_edges]
enabled = true
severity = "error"
min_length_mm = 0.79375            # Revit ShortCurveTolerance, ~1/32 in (forum-sourced; configurable)
include_curves = true
near_band = 0.10

[rules.extents]
enabled = true
severity = "warning"
max_distance_from_origin_mm = 16093440.0   # 10 miles (Autodesk: maximum distance limit)
max_total_extent_mm = 32186880.0           # 20 miles (Autodesk: extents greater than 20 miles)

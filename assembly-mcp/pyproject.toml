[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "limen-assembly-mcp"
version = "0.2.0a1"
description = "Architectural assembly MCP tools with optional isolated live scratch hosts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.30,<2", "pydantic>=2.11,<3", "rhino3dm>=8,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
limen-rhino-mcp = "limen_assembly_mcp.server:rhino_main"
limen-revit-mcp = "limen_assembly_mcp.server:revit_main"
limen-mcp-scratch = "limen_assembly_mcp.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
